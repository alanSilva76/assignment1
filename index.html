<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Assignment 1: Vitals</title>
</head>
<body>
 
  <h1>Assignment 1: Vitals</h1>

  <p>As part of a hospital vital signs display, create a row of boxes with vital stats in them.</p>

  <div class="vital-container">

        <div class="vital-box">
            <h2>Pulse</h2>
            <p class="value">72<span class="unit">bpm</span></p>
        </div>

        <div class="vital-box">
            <h2>Blood Oxygen Level</h2>
            <p class="value">98<span class="unit">%</span></p>
        </div>

        <div class="vital-box">
            <h2>Avg. Sleep Time</h2>
            <p class="value">7.5<span class="unit">hrs</span></p>
        </div>

  </div>
  

  
</body>
</html>
